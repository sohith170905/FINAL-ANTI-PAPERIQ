<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 160" width="100" height="80">
  <defs>
    <linearGradient id="brainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="50%" stop-color="#0C4A6E"/>
      <stop offset="100%" stop-color="#082F49"/>
    </linearGradient>
    <linearGradient id="bookGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Left: Stylized Brain Hemisphere with Neural Network -->
  <g id="brain-side">
    <!-- Brain Silhouette Lobes -->
    <path d="M96 28 C78 26, 62 36, 56 50 C48 54, 44 64, 46 76 C42 86, 45 98, 54 106 C50 114, 55 124, 66 128 C74 130, 84 126, 90 120 C94 122, 96 123, 96 123" 
          fill="none" stroke="url(#brainGrad)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M94 48 C82 48, 72 56, 70 66 C64 72, 66 82, 72 88 C70 96, 76 104, 84 106 C90 108, 94 104, 95 102" 
          fill="none" stroke="url(#brainGrad)" stroke-width="4.5" stroke-linecap="round" opacity="0.85" />
    
    <!-- Neural Network Node Connections -->
    <line x1="72" y1="62" x2="88" y2="44" stroke="#38BDF8" stroke-width="2.5" />
    <line x1="72" y1="62" x2="64" y2="82" stroke="#38BDF8" stroke-width="2.5" />
    <line x1="64" y1="82" x2="84" y2="92" stroke="#38BDF8" stroke-width="2.5" />
    <line x1="88" y1="44" x2="102" y2="34" stroke="#38BDF8" stroke-width="2.5" />
    <line x1="88" y1="44" x2="102" y2="60" stroke="#38BDF8" stroke-width="2.5" />
    <line x1="102" y1="60" x2="84" y2="92" stroke="#38BDF8" stroke-width="2.5" />
    <line x1="84" y1="92" x2="98" y2="114" stroke="#38BDF8" stroke-width="2.5" />

    <!-- Neural Nodes -->
    <circle cx="88" cy="44" r="5" fill="#38BDF8" />
    <circle cx="72" cy="62" r="5" fill="#0284C7" />
    <circle cx="64" cy="82" r="4.5" fill="#38BDF8" />
    <circle cx="84" cy="92" r="5.5" fill="#0284C7" />
    <circle cx="98" cy="114" r="4.5" fill="#38BDF8" />
  </g>

  <!-- Central Bridge Nodes (Golden and Cyan) -->
  <g id="bridge">
    <line x1="102" y1="34" x2="118" y2="24" stroke="#F59E0B" stroke-width="2.5" />
    <circle cx="102" cy="34" r="5.5" fill="#38BDF8" />
    <circle cx="118" cy="24" r="6.5" fill="url(#goldGrad)" filter="url(#glow)" />
    <circle cx="102" cy="60" r="5" fill="#0284C7" />
  </g>

  <!-- Right: Stylized Open Book Pages -->
  <g id="book-side">
    <!-- Spine Line -->
    <line x1="98" y1="28" x2="98" y2="128" stroke="#0F2A4A" stroke-width="4.5" stroke-linecap="round" />
    
    <!-- Outer Main Page -->
    <path d="M100 128 C108 126, 126 120, 148 124 C148 98, 146 58, 142 36 C124 32, 108 34, 100 36 Z" 
          fill="url(#bookGrad)" />
    
    <!-- Inner Layered Wing/Page 1 -->
    <path d="M100 128 C110 125, 124 116, 138 118 C137 94, 134 60, 130 42 C116 38, 106 39, 100 40 Z" 
          fill="#38BDF8" opacity="0.8" />
          
    <!-- Inner Layered Wing/Page 2 -->
    <path d="M100 128 C108 124, 118 114, 126 114 C124 94, 120 66, 117 48 C108 45, 102 44, 100 45 Z" 
          fill="#E0F2FE" opacity="0.9" />

    <!-- Open Book Binding Base -->
    <path d="M90 128 C96 133, 102 133, 108 128 C118 132, 134 131, 146 128" 
          fill="none" stroke="#0F2A4A" stroke-width="4" stroke-linecap="round" />
  </g>
</svg>