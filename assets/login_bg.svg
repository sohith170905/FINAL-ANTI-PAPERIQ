<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Soft Glow Filter -->
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="orbGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="14" />
    </filter>
    <linearGradient id="traceGradLeft" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.12" />
      <stop offset="70%" stop-color="#0284C7" stop-opacity="0.32" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.55" />
    </linearGradient>
    <linearGradient id="traceGradRight" x1="100%" y1="50%" x2="0%" y2="50%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.12" />
      <stop offset="70%" stop-color="#0284C7" stop-opacity="0.32" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.55" />
    </linearGradient>
  </defs>

  <!-- Glowing Orbs Behind Circuits -->
  <g id="glowing-orbs" opacity="0.45">
    <circle cx="560" cy="460" r="45" fill="#38BDF8" filter="url(#orbGlow)" />
    <circle cx="1040" cy="460" r="45" fill="#38BDF8" filter="url(#orbGlow)" />
    <circle cx="340" cy="380" r="35" fill="#0284C7" filter="url(#orbGlow)" />
    <circle cx="1260" cy="380" r="35" fill="#0284C7" filter="url(#orbGlow)" />
    <circle cx="480" cy="620" r="30" fill="#38BDF8" filter="url(#orbGlow)" />
    <circle cx="1120" cy="620" r="30" fill="#38BDF8" filter="url(#orbGlow)" />
  </g>

  <!-- LEFT SIDE CIRCUITS (Branching from center card towards the left) -->
  <g id="circuits-left" stroke="url(#traceGradLeft)" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Trace 1 (Upper) -->
    <path d="M580 340 L520 340 L460 260 L280 260 L240 220 L140 220" />
    <circle cx="140" cy="220" r="3" fill="#0284C7" />
    <circle cx="280" cy="260" r="2.5" fill="#38BDF8" />

    <!-- Trace 2 (Upper Middle) -->
    <path d="M580 380 L500 380 L440 320 L300 320 L260 360 L180 360" />
    <circle cx="180" cy="360" r="3" fill="#0284C7" />
    <circle cx="440" cy="320" r="2.5" fill="#38BDF8" />

    <!-- Trace 3 (Main Horizontal Hub) -->
    <path d="M580 440 L480 440 L420 440 L360 480 L220 480 L180 520 L80 520" />
    <circle cx="80" cy="520" r="3.5" fill="#38BDF8" />
    <circle cx="420" cy="440" r="4" fill="#0284C7" />

    <!-- Trace 4 (Lower Middle) -->
    <path d="M580 500 L500 500 L440 560 L320 560 L280 620 L160 620" />
    <circle cx="160" cy="620" r="3" fill="#0284C7" />
    <circle cx="440" cy="560" r="2.5" fill="#38BDF8" />

    <!-- Trace 5 (Lower) -->
    <path d="M580 560 L520 560 L460 660 L300 660 L240 720 L120 720" />
    <circle cx="120" cy="720" r="3" fill="#0284C7" />
    <circle cx="460" cy="660" r="3" fill="#38BDF8" />

    <!-- Branching Vertical Drops -->
    <path d="M360 480 L360 410 L300 410" />
    <circle cx="300" cy="410" r="2.5" fill="#0284C7" />

    <path d="M480 440 L480 530 L400 530" />
    <circle cx="400" cy="530" r="2.5" fill="#38BDF8" />
  </g>

  <!-- RIGHT SIDE CIRCUITS (Branching from center card towards the right) -->
  <g id="circuits-right" stroke="url(#traceGradRight)" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Trace 1 (Upper) -->
    <path d="M1020 340 L1080 340 L1140 260 L1320 260 L1360 220 L1460 220" />
    <circle cx="1460" cy="220" r="3" fill="#0284C7" />
    <circle cx="1320" cy="260" r="2.5" fill="#38BDF8" />

    <!-- Trace 2 (Upper Middle) -->
    <path d="M1020 380 L1100 380 L1160 320 L1300 320 L1340 360 L1420 360" />
    <circle cx="1420" cy="360" r="3" fill="#0284C7" />
    <circle cx="1160" cy="320" r="2.5" fill="#38BDF8" />

    <!-- Trace 3 (Main Horizontal Hub) -->
    <path d="M1020 440 L1120 440 L1180 440 L1240 480 L1380 480 L1420 520 L1520 520" />
    <circle cx="1520" cy="520" r="3.5" fill="#38BDF8" />
    <circle cx="1180" cy="440" r="4" fill="#0284C7" />

    <!-- Trace 4 (Lower Middle) -->
    <path d="M1020 500 L1100 500 L1160 560 L1280 560 L1320 620 L1440 620" />
    <circle cx="1440" cy="620" r="3" fill="#0284C7" />
    <circle cx="1160" cy="560" r="2.5" fill="#38BDF8" />

    <!-- Trace 5 (Lower) -->
    <path d="M1020 560 L1080 560 L1140 660 L1300 660 L1360 720 L1480 720" />
    <circle cx="1480" cy="720" r="3" fill="#0284C7" />
    <circle cx="1140" cy="660" r="3" fill="#38BDF8" />

    <!-- Branching Vertical Drops -->
    <path d="M1240 480 L1240 410 L1300 410" />
    <circle cx="1300" cy="410" r="2.5" fill="#0284C7" />

    <path d="M1120 440 L1120 530 L1200 530" />
    <circle cx="1200" cy="530" r="2.5" fill="#38BDF8" />
  </g>

  <!-- SKETCHED RESEARCH ICONS (Left and Right Wings) -->
  <g id="research-icons" stroke="#0284C7" stroke-width="1.6" fill="none" opacity="0.38" stroke-linecap="round" stroke-linejoin="round">
    <!-- Open Book 1 (Left Upper) -->
    <g transform="translate(240, 290) scale(0.9)">
      <path d="M0 24 C8 21, 20 18, 30 20 L30 4 C20 2, 8 5, 0 8 Z" />
      <path d="M0 24 C-8 21, -20 18, -30 20 L-30 4 C-20 2, -8 5, 0 8 Z" />
      <line x1="0" y1="8" x2="0" y2="24" />
      <line x1="-22" y1="8" x2="-6" y2="10" />
      <line x1="-22" y1="13" x2="-6" y2="15" />
      <line x1="6" y1="10" x2="22" y2="8" />
      <line x1="6" y1="15" x2="22" y2="13" />
    </g>

    <!-- Open Book 2 (Left Lower) -->
    <g transform="translate(200, 570) scale(0.85)">
      <path d="M0 24 C8 21, 20 18, 30 20 L30 4 C20 2, 8 5, 0 8 Z" />
      <path d="M0 24 C-8 21, -20 18, -30 20 L-30 4 C-20 2, -8 5, 0 8 Z" />
      <line x1="0" y1="8" x2="0" y2="24" />
      <line x1="-22" y1="8" x2="-6" y2="10" />
      <line x1="-22" y1="13" x2="-6" y2="15" />
      <line x1="6" y1="10" x2="22" y2="8" />
      <line x1="6" y1="15" x2="22" y2="13" />
    </g>

    <!-- Open Book 3 (Right Upper) -->
    <g transform="translate(1360, 290) scale(0.9)">
      <path d="M0 24 C8 21, 20 18, 30 20 L30 4 C20 2, 8 5, 0 8 Z" />
      <path d="M0 24 C-8 21, -20 18, -30 20 L-30 4 C-20 2, -8 5, 0 8 Z" />
      <line x1="0" y1="8" x2="0" y2="24" />
      <line x1="-22" y1="8" x2="-6" y2="10" />
      <line x1="-22" y1="13" x2="-6" y2="15" />
      <line x1="6" y1="10" x2="22" y2="8" />
      <line x1="6" y1="15" x2="22" y2="13" />
    </g>

    <!-- Magnifying Glass (Right Lower) -->
    <g transform="translate(1400, 560) scale(0.85)">
      <circle cx="0" cy="0" r="14" />
      <line x1="10" y1="10" x2="24" y2="24" stroke-width="2.5" />
      <line x1="-6" y1="-3" x2="6" y2="-3" opacity="0.6" />
      <line x1="-4" y1="2" x2="4" y2="2" opacity="0.6" />
    </g>

    <!-- Magnifying Glass (Left Lower) -->
    <g transform="translate(320, 480) scale(0.8)">
      <circle cx="0" cy="0" r="14" />
      <line x1="10" y1="10" x2="24" y2="24" stroke-width="2.5" />
    </g>

    <!-- Neural Network Graph Cluster (Left) -->
    <g transform="translate(170, 430)">
      <circle cx="0" cy="0" r="4.5" fill="#0284C7" fill-opacity="0.3" />
      <circle cx="-20" cy="-14" r="3.5" fill="#38BDF8" fill-opacity="0.4" />
      <circle cx="-24" cy="16" r="3.5" fill="#38BDF8" fill-opacity="0.4" />
      <circle cx="22" cy="-12" r="3.5" fill="#38BDF8" fill-opacity="0.4" />
      <circle cx="20" cy="18" r="3.5" fill="#38BDF8" fill-opacity="0.4" />
      <line x1="0" y1="0" x2="-20" y2="-14" />
      <line x1="0" y1="0" x2="-24" y2="16" />
      <line x1="0" y1="0" x2="22" y2="-12" />
      <line x1="0" y1="0" x2="20" y2="18" />
      <line x1="-20" y1="-14" x2="-24" y2="16" />
      <line x1="22" y1="-12" x2="20" y2="18" />
    </g>

    <!-- Neural Network Graph Cluster (Right) -->
    <g transform="translate(1450, 430)">
      <circle cx="0" cy="0" r="4.5" fill="#0284C7" fill-opacity="0.3" />
      <circle cx="-20" cy="-14" r="3.5" fill="#38BDF8" fill-opacity="0.4" />
      <circle cx="-24" cy="16" r="3.5" fill="#38BDF8" fill-opacity="0.4" />
      <circle cx="22" cy="-12" r="3.5" fill="#38BDF8" fill-opacity="0.4" />
      <circle cx="20" cy="18" r="3.5" fill="#38BDF8" fill-opacity="0.4" />
      <line x1="0" y1="0" x2="-20" y2="-14" />
      <line x1="0" y1="0" x2="-24" y2="16" />
      <line x1="0" y1="0" x2="22" y2="-12" />
      <line x1="0" y1="0" x2="20" y2="18" />
      <line x1="-20" y1="-14" x2="-24" y2="16" />
      <line x1="22" y1="-12" x2="20" y2="18" />
    </g>

    <!-- Technical Data Sliders / Bars (Left) -->
    <g transform="translate(180, 290)" opacity="0.6">
      <line x1="0" y1="0" x2="0" y2="30" />
      <circle cx="0" cy="10" r="2.5" fill="#0284C7" />
      <line x1="8" y1="0" x2="8" y2="30" />
      <circle cx="8" cy="22" r="2.5" fill="#0284C7" />
      <line x1="16" y1="0" x2="16" y2="30" />
      <circle cx="16" cy="6" r="2.5" fill="#0284C7" />
    </g>

    <!-- Technical Data Sliders / Bars (Right) -->
    <g transform="translate(1410, 290)" opacity="0.6">
      <line x1="0" y1="0" x2="0" y2="30" />
      <circle cx="0" cy="18" r="2.5" fill="#0284C7" />
      <line x1="8" y1="0" x2="8" y2="30" />
      <circle cx="8" cy="8" r="2.5" fill="#0284C7" />
      <line x1="16" y1="0" x2="16" y2="30" />
      <circle cx="16" cy="24" r="2.5" fill="#0284C7" />
    </g>
  </g>

  <!-- SPARKLES AND GLOWING POINTS (✦) -->
  <g id="sparkles" fill="#0284C7" opacity="0.55">
    <!-- Star 1 (Left) -->
    <path d="M260 480 Q260 488 268 488 Q260 488 260 496 Q260 488 252 488 Q260 488 260 480 Z" />
    <!-- Star 2 (Right) -->
    <path d="M1340 480 Q1340 488 1348 488 Q1340 488 1340 496 Q1340 488 1332 488 Q1340 488 1340 480 Z" />
    <!-- Star 3 (Right Lower) -->
    <path d="M1480 680 Q1480 692 1492 692 Q1480 692 1480 704 Q1480 692 1468 692 Q1480 692 1480 680 Z" fill="#38BDF8" opacity="0.75" />
    <!-- Star 4 (Left Lower) -->
    <path d="M140 680 Q140 692 1492 692" opacity="0" />
    <path d="M120 680 Q120 690 130 690 Q120 690 120 700 Q120 690 110 690 Q120 690 120 680 Z" fill="#38BDF8" opacity="0.75" />
    
    <!-- Small Particle Dots -->
    <circle cx="360" cy="220" r="1.8" fill="#38BDF8" />
    <circle cx="480" cy="280" r="1.8" fill="#0284C7" />
    <circle cx="280" cy="620" r="1.8" fill="#38BDF8" />
    <circle cx="1240" cy="220" r="1.8" fill="#38BDF8" />
    <circle cx="1120" cy="280" r="1.8" fill="#0284C7" />
    <circle cx="1320" cy="620" r="1.8" fill="#38BDF8" />
  </g>
</svg>